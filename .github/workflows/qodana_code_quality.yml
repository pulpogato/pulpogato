name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: # Specify your branches here
      - main # The 'main' branch
      - "releases/*" # The release branches

jobs:
  qodana:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }} # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0 # a full history is required for pull request analysis
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: 21
          distribution: zulu
      - name: "Qodana Scan"
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        with:
          pr-mode: false
          # Native mode so Gradle Daemon JVM criteria can use the JDK from setup-java
          # (Docker mode only has JBR 25 and cannot download toolchain 21 without URLs).
          args: --within-docker false
          use-caches: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1577463682 }}
          QODANA_ENDPOINT: "https://qodana.cloud"
