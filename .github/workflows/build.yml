name: Gradle Build

on:
  pull_request:
  push:
    branches: ["*"]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:

jobs:
  build:
    name: "Build with Gradle"
    runs-on: ubuntu-26.04-arm
    env:
      MAX_WORKERS: 2

    permissions:
      security-events: write
      packages: write
      actions: read
      contents: write
      id-token: write
      attestations: write
      pages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Fetch tags
        if: github.ref == 'refs/heads/main'
        run: git fetch --tags

      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: 21
          distribution: zulu
          cache: gradle

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Extract GitHub API Version
        id: api-version
        run: echo "version=$(grep 'gh.api.commit' gradle.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Downloaded Schemas
        id: schema-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            */build/generated-src/main/resources/schema.json
            */build/resources/main/schema.graphqls
          key: schema-cache-${{ steps.api-version.outputs.version }}

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build Main Project
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew --max-workers=$MAX_WORKERS -Pcoverage=true build :pulpogato-docs:asciidoctor jacocoTestReport --continue

      - name: Run Pitest (Renovate PRs Only)
        if: github.event_name == 'pull_request' && github.actor == 'renovate[bot]'
        run: ./gradlew --max-workers=$MAX_WORKERS pitest

      - name: Build Snapshot
        if: github.ref == 'refs/heads/main'
        env: &env
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPEUSERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPEPASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGKEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGPASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --max-workers=$MAX_WORKERS -Pcoverage=true -Pcodegen.format=true build :pulpogato-docs:asciidoctor jacocoTestReport snapshot

      - name: Run Sonar Analysis
        # always() so this still runs (and uploads whatever coverage/sources it can) even if the
        # previous --continue build had unrelated failures, matching the old single-invocation behavior.
        if: always() && !startsWith(github.ref, 'refs/tags/v')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew --max-workers=$MAX_WORKERS -Pcoverage=true sonar

      - name: Deploy docs to ghpages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./pulpogato-docs/build/
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Build Candidate
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc')
        env: *env
        run: ./gradlew --max-workers=$MAX_WORKERS -Prelease.useLastTag=true -Pcodegen.format=true build candidate

      - name: Build Final
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc')
        env: *env
        run: ./gradlew --max-workers=$MAX_WORKERS -Prelease.useLastTag=true -Pcodegen.format=true build final

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          subject-path: "build/repos/**/*.jar,build/repos/**/*.pom,build/repos/**/*.module"
