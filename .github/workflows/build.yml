name: Gradle Build

on:
  pull_request:
  push:
    branches: ["main"]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      max_workers:
        description: "Maximum Gradle workers"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: "Build with Gradle"
    runs-on: ubuntu-26.04-arm
    env:
      MAX_WORKERS: ${{ inputs.max_workers || (github.run_attempt > 1 && '2' || '3') }}

    permissions:
      security-events: write
      packages: write
      actions: read
      contents: write
      id-token: write
      attestations: write
      pages: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch tags
        if: github.ref == 'refs/heads/main'
        run: git fetch --tags

      - uses: gradle/actions/wrapper-validation@v6.4.1

      - uses: actions/setup-java@v6.1.0
        with:
          java-version: 21
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Check REST codegen plugin
        run: ./gradlew --project-dir gradle/pulpogato-rest-codegen check

      - name: Cache Downloaded Schemas
        id: schema-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            */build/generated-src/main/resources/github.schema.json
            */build/generated-src/main/resources/pulpogato-headers.properties
            */build/generated-src/main/resources/schema.graphqls
          key: schema-cache-v2-${{ hashFiles('gradle.properties') }}

      - name: Cache SonarQube packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build Main Project
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew --max-workers=$MAX_WORKERS -Pcoverage=true build :pulpogato-docs:asciidoctor jacocoTestReport --continue

      - name: Run Pitest (Renovate PRs Only)
        if: github.event_name == 'pull_request' && github.actor == 'renovate[bot]'
        run: ./gradlew --max-workers=$MAX_WORKERS pitest

      - name: Build Snapshot
        if: github.ref == 'refs/heads/main'
        env: &env
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPEUSERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPEPASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGKEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGPASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --max-workers=$MAX_WORKERS -Pcoverage=true -Pcodegen.format=true build :pulpogato-docs:asciidoctor jacocoTestReport snapshot

      - name: Run Sonar Analysis
        # always() so this still runs (and uploads whatever coverage/sources it can) even if the
        # previous --continue build had unrelated failures, matching the old single-invocation behavior.
        if: always() && !startsWith(github.ref, 'refs/tags/v')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew --max-workers=$MAX_WORKERS -Pcoverage=true sonar

      - name: Deploy docs to ghpages
        uses: peaceiris/actions-gh-pages@v4.1.0
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./pulpogato-docs/build/
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Build Candidate
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc')
        env: *env
        run: ./gradlew --max-workers=$MAX_WORKERS -Prelease.useLastTag=true -Pcodegen.format=true build candidate

      - name: Build Final
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc')
        env: *env
        run: ./gradlew --max-workers=$MAX_WORKERS -Prelease.useLastTag=true -Pcodegen.format=true build final

      - uses: actions/attest-build-provenance@v4.2.2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          subject-path: "build/repos/**/*.jar,build/repos/**/*.pom,build/repos/**/*.module"

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists. Skipping release creation."
            exit 0
          fi
          if [[ "${GITHUB_REF_NAME}" == *"-rc"* ]]; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes --prerelease
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi
