name: Unignore Tests

on:
  schedule:
    - cron: "0 22 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  unignore-tests:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 21
          distribution: zulu
          cache: gradle

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Run unignore script
        run: |-
          uv run --no-build --locked scripts/unignore.py

      - name: Run delete-customizations script
        run: |-
          uv run --no-build --locked scripts/delete-customizations.py

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected:"
            git diff
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Mint the app token here, not at job start: installation tokens expire
      # 1 hour after creation, and the Gradle check above can run longer than that.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        if: steps.check.outputs.changed == 'true'
        with:
          client-id: 1784694
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        if: steps.check.outputs.changed == 'true'
        run: |-
          git checkout -b unignore-tests
          git add .
          git commit -m "Unignore tests"
          git push --force origin unignore-tests
          gh pr create --base main --fill
