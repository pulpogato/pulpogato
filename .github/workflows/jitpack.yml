name: Trigger Jitpack Build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

jobs:
  build:
    name: "Trigger Jitpack Build"
    runs-on: ubuntu-26.04-arm

    permissions:
      contents: read

    steps:
      - name: Trigger Jitpack Build
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          GROUP_ID="com.github.pulpogato.pulpogato"
          ARTIFACT_ID="pulpogato-common"
          VERSION="${GITHUB_REF_NAME#v}"
          GROUP_PATH="${GROUP_ID//.//}"
          URL="https://jitpack.io/${GROUP_PATH}/${ARTIFACT_ID}/${VERSION}/${ARTIFACT_ID}-${VERSION}.pom"
          curl --connect-timeout 5 --max-time 5 "${URL}" || echo "Jitpack build triggered for ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}"
