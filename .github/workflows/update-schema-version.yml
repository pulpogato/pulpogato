name: Update Schema Version

on:
  schedule:
    - cron: "0 16 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  gh-api-update:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: 1784694
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Configure Git User
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: gradle/actions/wrapper-validation@v6.4.1

      - uses: actions/setup-java@v6.3.0
        with:
          java-version: 21
          distribution: zulu
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Update REST, GraphQL, and tooling schema versions
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |-
          ./scripts/update-schema-version.sh
