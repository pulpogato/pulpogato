name: Dependency Submission

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/wrapper-validation@v6.4.1
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6.4.1
