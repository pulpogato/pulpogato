name: Check Issue Statuses

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  check-issue-statuses:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: gradle/actions/wrapper-validation@v6.4.1

      - uses: actions/setup-java@v6.3.0
        with:
          java-version: 21
          distribution: zulu
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Check statuses
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./gradlew checkIssueStatuses
