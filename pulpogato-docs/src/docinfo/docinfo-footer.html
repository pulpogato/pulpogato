<script>
(function () {
    const copyEmoji = {
        copy: "📋",
        copied: "✅",
        failed: "❌",
    };

    const copyLabels = {
        copy: "Copy code block",
        copied: "Copied",
        failed: "Copy failed",
    };

    function setButtonIcon(button, state) {
        button.textContent = copyEmoji[state];
        button.setAttribute("aria-label", copyLabels[state]);
        if (state !== "copy") {
            window.setTimeout(function () {
                setButtonIcon(button, "copy");
            }, 1200);
        }
    }

    function addCopyButton(listingBlock) {
        const content = listingBlock.querySelector(":scope > .content");
        const code = listingBlock.querySelector("pre code");

        if (!content || !code) {
            return;
        }

        const button = document.createElement("button");
        button.className = "copy-code-button";
        button.type = "button";
        setButtonIcon(button, "copy");
        button.addEventListener("click", function () {
            const copy = code.cloneNode(true);
            // Asciidoctor renders each callout with a marker and a plain-text fallback.
            copy.querySelectorAll(".conum + b").forEach(function (fallback) {
                fallback.remove();
            });
            copy.querySelectorAll(".conum[data-value]").forEach(function (callout) {
                callout.replaceWith(`// <${callout.dataset.value}>`);
            });
            navigator.clipboard.writeText(copy.textContent).then(
                function () {
                    setButtonIcon(button, "copied");
                },
                function () {
                    setButtonIcon(button, "failed");
                },
            );
        });
        content.appendChild(button);
    }

    function highlightCurrentSection() {
        const toc = document.getElementById("toc");
        if (!toc) {
            return;
        }

        toc.setAttribute("role", "navigation");
        toc.setAttribute("aria-label", "On this page");
        const sections = Array.from(toc.querySelectorAll('a[href^="#"]'), function (link) {
            return { link, heading: document.getElementById(link.hash.slice(1)) };
        }).filter(function (section) {
            return section.heading;
        });
        if (!sections.length) {
            return;
        }

        let currentLink;
        let pending = false;
        function update() {
            pending = false;
            const position = 48;
            let active = sections[0];
            for (const section of sections) {
                if (section.heading.getBoundingClientRect().top > position) {
                    break;
                }
                active = section;
            }

            // Near the bottom, a linked heading may stay below the top of the viewport.
            const page = document.scrollingElement;
            if (page.scrollTop + page.clientHeight >= page.scrollHeight - 1) {
                active = sections.find(function (section) {
                    return section.link.hash === window.location.hash
                        && section.heading.getBoundingClientRect().top >= 0;
                }) || sections[sections.length - 1];
            }

            if (active.link !== currentLink) {
                currentLink?.removeAttribute("aria-current");
                active.link.setAttribute("aria-current", "location");
                currentLink = active.link;
            }
        }

        function scheduleUpdate() {
            if (!pending) {
                pending = true;
                window.requestAnimationFrame(update);
            }
        }

        window.addEventListener("scroll", scheduleUpdate, { passive: true });
        window.addEventListener("resize", scheduleUpdate);
        window.addEventListener("hashchange", scheduleUpdate);
        window.addEventListener("load", scheduleUpdate);
        update();
    }

    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".listingblock").forEach(addCopyButton);
        highlightCurrentSection();
    });
})();
</script>
