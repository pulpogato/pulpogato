<style>
body.article {
    --docs-ink: #202936;
    --docs-muted: #49596c;
    --docs-accent: #194fa9;
    --docs-border: #dce3eb;
    --docs-sidebar: #f0f3f7;
    --docs-active: #deebff;
    --docs-code: #f6f8fb;
    --docs-font: system-ui, sans-serif;
    --docs-gutter: clamp(1.25rem, 4vw, 3.25rem);
    background: #fff;
    color: var(--docs-ink);
    font-family: var(--docs-font);
    line-height: 1.6;
}

#header,
#content,
.docs-masthead {
    max-width: 52rem;
    padding-inline: var(--docs-gutter);
}

.docs-masthead {
    margin-inline: auto;
    padding-block-start: clamp(1.5rem, 4vw, 3rem);
}

.docs-masthead::after {
    border-top: 1px solid var(--docs-border);
    content: "";
    display: block;
    margin-block-start: 0.75rem;
}

.docs-heading {
    --docs-logo-width: clamp(4.5rem, 8vw, 6.25rem);
    padding-inline-start: calc(var(--docs-logo-width) + 0.75rem);
    position: relative;
}

.docs-heading h1 {
    color: var(--docs-ink);
    font-family: var(--docs-font);
    font-size: clamp(2.25rem, 5vw, 3.5rem);
    font-weight: 660;
    letter-spacing: -0.05em;
    line-height: 1.08;
    margin: 0;
}

.docs-heading img {
    height: 100%;
    inset-block-start: 0;
    inset-inline-start: 0;
    object-fit: contain;
    position: absolute;
    width: var(--docs-logo-width);
}

.docs-heading p {
    color: var(--docs-muted);
    font-size: 1rem;
    letter-spacing: normal;
    line-height: 1.5;
    margin: 0.25rem 0 0;
}

#content :is(h2, h3, h4, h5, h6) {
    color: var(--docs-ink);
    font-family: var(--docs-font);
    font-weight: 650;
    letter-spacing: -0.025em;
    scroll-margin-top: 1.5rem;
}

#content h2 {
    font-size: 1.625rem;
}

#content h3 {
    font-size: 1.25rem;
}

#content h4 {
    font-size: 1.0625rem;
}

#content :is(h2, h3, h4, h5, h6) > a.link {
    color: inherit;
}

#content p {
    font-size: 1rem;
    letter-spacing: normal;
    line-height: 1.65;
}

#content a {
    color: var(--docs-accent);
    text-underline-offset: 0.15em;
}

#content :not(pre) > code {
    background: var(--docs-code);
    color: var(--docs-ink);
}

#content .listingblock pre,
#content .listingblock pre.rouge {
    background: var(--docs-code);
    border: 1px solid var(--docs-border);
    border-radius: 0.375rem;
}

#toctitle:empty {
    display: none;
}

#toc ul {
    font-family: var(--docs-font);
    margin-block-end: 0;
}

#toc li {
    margin-block-start: 0.125rem;
}

#toc a {
    border-radius: 0.3125rem;
    color: var(--docs-muted);
    display: block;
    padding: 0.375rem 0.625rem;
}

#toc a:hover {
    color: var(--docs-accent);
    text-decoration: underline;
}

#toc a[aria-current="location"] {
    background: var(--docs-active);
    color: var(--docs-accent);
    font-weight: 650;
}

@media screen and (min-width: 768px) {
    body.toc2.toc-left {
        padding-left: clamp(14rem, 22vw, 18rem);
    }

    #toc.toc2 {
        background: var(--docs-sidebar);
        border-color: var(--docs-border);
        padding: 2rem 0.75rem 1rem;
        width: clamp(14rem, 22vw, 18rem);
    }

    #toc.toc2 ul ul {
        padding-inline-start: 0.75rem;
    }
}

.listingblock > .content {
    position: relative;
}

.listingblock > .content > pre {
    padding-right: 3rem;
}

.listingblock .copy-code-button {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(0, 0, 0, 0.2);
    border-radius: 4px;
    background: #fff;
    font-size: 0.875rem;
    line-height: 1;
    padding: 0.25rem 0.35rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
}

.listingblock:hover .copy-code-button,
.listingblock:focus-within .copy-code-button {
    opacity: 1;
    pointer-events: auto;
}

@media (hover: none) {
    .listingblock .copy-code-button {
        opacity: 1;
        pointer-events: auto;
    }
}

.listingblock .copy-code-button:hover,
.listingblock .copy-code-button:focus {
    background: #f7f7f8;
    color: rgba(0, 0, 0, 0.9);
}
</style>
